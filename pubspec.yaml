name: kawaru
description: 0 Maliyetli, Tamamen Çevrimdışı, Evrensel Dönüştürücü ve Tarayıcı.
publish_to: 'none'
version: 1.1.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  shared_preferences: ^2.3.2
  
  # State Management
  flutter_riverpod: ^2.5.1
  
  # Local Database (Isar)
  isar: ^3.1.0
  isar_flutter_libs: ^3.1.0
  
  # Core Scanner Packages
  camera: ^0.10.5+9
  image_cropper: ^12.2.1
  image: ^4.1.7 # Image processing and filters
  pdf: ^3.10.8 # PDF generation
  
  # Utility
  path_provider: ^2.1.2
  share_plus: ^9.0.0
  image_picker: ^1.1.2
  
  # UI & Styling
  cupertino_icons: ^1.0.6
  uuid: ^4.3.3
  intl: ^0.20.2
  file_picker: ^8.0.7
  pdfx: ^2.6.0
  google_mlkit_text_recognition: ^0.16.0
  local_auth: ^3.0.2
  signature: ^6.4.0
  flutter_tts: ^4.2.5
  google_mlkit_barcode_scanning: ^0.15.0
  loading_animation_widget: ^1.3.0
  google_fonts: ^8.2.1
  syncfusion_flutter_pdf: ^34.2.2
  url_launcher: ^6.3.2
  ffmpeg_kit_flutter_new: ^4.6.2
  whisper_flutter_new: ^1.0.1
  audioplayers: ^6.8.1
  video_player: ^2.13.0
  photo_view: ^0.14.0
  record: ^6.0.0
  archive: ^4.0.9
  flutter_image_compress: ^2.3.0
  path: ^1.9.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  
  # Code Generation
  build_runner: ^2.4.9
  isar_generator: ^3.1.0
  
  # Production Assets Generation
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.0

flutter:
  generate: true
  uses-material-design: true
  # assets:
  #   - assets/images/

# --- Production Ready Configurations ---

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21
  web:
    generate: false

flutter_native_splash:
  color: "#000000"
  color_dark: "#000000"
  android_12:
    color: "#000000"
    color_dark: "#000000"
